<!doctype html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Test</title>
    <style>
      body {
        margin: 0;
        background: black;
        overflow: hidden;
        font-family: monospace;
        position: relative;
        cursor: none;
      }

      video {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: .1;
      }
    </style>
</head>
<body>
<video src="../video.mp4" autoplay loop muted playsinline></video>

</body>
<script>
const canvas = document.getElementById("letters");
const ctx = canvas.getContext("2d");
const lockSentenceAfter = 5000;

let width, height, lockReached;
let lockedCellsNum = 0;

window.setTimeout(function(){
    lockReached = true;
}, lockSentenceAfter);

function resize() {
  width = canvas.width = window.innerWidth
  height = canvas.height = window.innerHeight
}

window.addEventListener("resize", resize)
resize()

const letters =
"ABCDEFGHIJKLMNOPQRSTUVWXYZ" +
"abcdefghijklmnopqrstuvwxyz" +
"0123456789" +
"!@#$%^&*()-_=+[]{}|;:,.<>/?~";

function randomLetter() {
  return letters[Math.floor(Math.random() * letters.length)]
}

const fontSize = 20
let cols = Math.floor(width / fontSize)
let rows = Math.floor(height / fontSize)

const sentence = "WE ARE AIDA"
const strippedSentence = sentence.replace(' ', '');
const centerRow = Math.floor(rows / 2)
const startCol = Math.floor((cols - sentence.length) / 2)

const grid = []

for (let r = 0; r < rows; r++) {
  for (let c = 0; c < cols; c++) {

    let target = null
    let locked = false
    let char = randomLetter()

    if (r === centerRow && c >= startCol && c < startCol + sentence.length) {
      target = sentence[c - startCol]

      if (target === " ") {
        char = " "
        locked = true
      }
    }

    grid.push({
      x: c * fontSize,
      y: r * fontSize,
      char,
      target,
      locked
    })
  }
}

let targetMouse = { x: -999, y: -999 }
let currentMouse = { x: -999, y: -999 }

window.addEventListener("mousemove", e => {
  targetMouse.x = e.clientX
  targetMouse.y = e.clientY
})

function animate() {
  let found = false;
  ctx.clearRect(0, 0, width, height)

  // Fluid mouse easing (linear interpolation)
  if (currentMouse.x === -999 && targetMouse.x !== -999) {
    currentMouse.x = targetMouse.x
    currentMouse.y = targetMouse.y
  } else if (targetMouse.x !== -999) {
    currentMouse.x += (targetMouse.x - currentMouse.x) * 0.1
    currentMouse.y += (targetMouse.y - currentMouse.y) * 0.1
  }

  ctx.font = `${fontSize}px monospace`
  ctx.textBaseline = "top"

  for (const cell of grid) {

    // DISPLACEMENT EFFECT
    const dx = cell.x - currentMouse.x
    const dy = cell.y - currentMouse.y
    const dist = Math.sqrt(dx * dx + dy * dy)

    let offsetX = 0
    let offsetY = 0

    const radius = 300 // effect radius
    if (dist < radius && dist > 0) {
      const force = (radius - dist) / radius
      offsetX = (dx / dist) * force * 15
      offsetY = (dy / dist) * force * 15
    }

    // LETTER SCRAMBLING
    if (!cell.target || (!cell.locked && cell.target !== " ")) {
      if (Math.random() < 0.02) cell.char = randomLetter()
    }

    if (cell.target && !cell.locked && cell.target !== " ") {
      if(!found && lockReached && lockedCellsNum < strippedSentence.length) {
        found = true;
        cell.char = cell.target;
      }

      if (cell.char === cell.target) {
        lockedCellsNum++;
        cell.locked = true

      } else if (Math.random() < 0.08){
        cell.char = randomLetter()
      }
    }

    // RENDER LETTER WITH OFFSET
    ctx.fillStyle = cell.locked ? "white" : "rgba(255,255,255,0.08)"
    ctx.fillText(cell.char, cell.x + offsetX, cell.y + offsetY)
  }

  requestAnimationFrame(animate)
}

animate()
</script>
</html>
